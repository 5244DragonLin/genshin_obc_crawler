# config.example.yaml —— 默认配置模板
# 复制本文件为 config.yaml 并按需修改；本文件提交到仓库，不含任何真实凭据

# 抓哪几类图鉴（键名写分类名、英文键或简称都认；不写本段 = 全抓）
# 前六类是信息来源最丰富的图鉴，各有专用建模；其余是观测枢「快捷导航」上的频道
catalogs:
  角色图鉴: true
  武器图鉴: true
  圣遗物图鉴: true
  敌人图鉴: true
  食物图鉴: true
  书籍图鉴: true
  灰眸图鉴: false
  组织图鉴: false
  头像图鉴: false
  材料图鉴: false
  家具图鉴: false
  秘境图鉴: false
  NPC与商店图鉴: false
  成就图鉴: false
  活动图鉴: false
  任务图鉴: false
  动物图鉴: false
  深境螺旋图鉴: false
  幻想真境剧诗图鉴: false
  幽境危战图鉴: false
  冒险家协会图鉴: false
  名片图鉴: false
  考据图鉴: false
  千星奇域图鉴: false
  卡牌图鉴: false
  影音回廊图鉴: false

# 输出目录，相对路径以项目根目录为基准
output_dir: output

# 是否下载词条封面到 assets/
download_images: true

# 每个分类最多导出几条，0 = 不限
limit: 0

# 角色保留哪些语言的语音：默认只留汉语；要日语/英语/韩语就加进列表，all = 全部
voice_languages:
  - 汉语

request:
  timeout: 30          # 单请求超时（秒）
  retries: 2           # 网络异常重试次数
  delay: 0.1           # 请求间隔（秒），对接口友好
  proxy: ""            # 代理地址（如 http://127.0.0.1:7890）；留空 = 绕过系统代理直连
  concurrency: 16      # 并发路数；16 经压测零失败，详见 README 的 FAQ。1 = 回到逐条串行

cache:
  enabled: false       # 词条原文本地缓存，默认关闭：全量重取约 15 秒，不值得占 40M 磁盘
  dir: .cache          # 仅在 enabled: true 时生效，相对路径以项目根目录为基准
  ttl_hours: 24        # 缓存有效期（小时），0 = 永不过期；超过 24 小时日常每日一跑必然全部过期

logging:
  verbose: false       # 打印每次请求明细
  progress: true       # 抓取时显示进度条（非终端自动降级为文字进度）
